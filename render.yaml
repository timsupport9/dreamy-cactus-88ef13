services:
  - type: web
    name: experthub
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AUTO_APPROVE_USERS
        value: "true"
      - key: DEV_EXPOSE_RESET_URL
        value: "false"
      - key: MPESA_ENABLED
        value: "false"
      - key: MPESA_ENV
        value: sandbox
