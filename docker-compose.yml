version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: experthub_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: experthub
      MYSQL_USER: experthub
      MYSQL_PASSWORD: experthub_secret
    ports: ["3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    container_name: experthub_redis
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  mysqldata:
